name: Run Playwright tests
on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:
jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    env:
      TEST_ENV: staging
      BASE_URL: ${{ vars.BASE_URL }}
      API_BASE_URL: ${{ vars.API_BASE_URL }}
      TEST_USER_EMAIL: ${{ secrets.TEST_USER_EMAIL }}
      TEST_USER_PASSWORD: ${{ secrets.TEST_USER_PASSWORD }}
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: lts/*
        cache: 'npm'
    - name: Install dependencies
      run: npm ci
    - name: Install Playwright Browsers
      run: npx playwright install --with-deps chromium firefox
    # PR: chỉ chạy @smoke (~vài chục giây) để feedback nhanh trước khi merge.
    # push vào main/master hoặc workflow_dispatch (chạy tay): full suite (smoke + regression) -
    # main là nhánh release nên cần coverage đầy đủ, không chỉ health-check.
    - name: Run API tests
      run: npx playwright test --project=api ${{ github.event_name == 'pull_request' && '--grep @smoke' || '' }}
    - name: Run UI tests
      run: npx playwright test --project=chromium --project=firefox ${{ github.event_name == 'pull_request' && '--grep @smoke' || '' }}
    - uses: actions/upload-artifact@v4
      if: ${{ !cancelled() }}
      with:
        name: playwright-report
        path: playwright-report/
        retention-days: 30
